services:
  postgres:
    image: postgres:16
    container_name: league_predictor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: league_admin
      POSTGRES_PASSWORD: league_pw
      POSTGRES_DB: league_predictor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: league_predictor_cache
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  pgdata: